# Local development, all in Docker: no .NET or Node install needed.
#
#   docker compose up -d --build     # everything: database, schema, API, web app
#   docker compose down -v           # stop and wipe the local database
#
# Startup order: db (healthy) -> db-tools deploys the schema and reference data, then exits
# -> api and worker (background jobs) -> web. Every `up` re-deploys the schema, which is a no-op when nothing changed.
# To see what a schema change would do without applying it:
#   docker compose run --rm db-tools plan
#
# App: http://localhost:5173   API: http://localhost:8080 (Swagger: /swagger)   Database: localhost:55432
# Emails sent locally: http://localhost:8025 (Mailpit)
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: pesaroll
      POSTGRES_USER: pesaroll
      POSTGRES_PASSWORD: pesaroll
    ports: ["55432:5432"]              # 55432 on your machine, so it never clashes with another PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 keeps its data in a versioned folder under here
    healthcheck:                       # ready only after first-start initialisation finishes
      test: ["CMD-SHELL", "pg_isready -U pesaroll -d pesaroll"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-tools:
    build: ./database
    command: ["deploy"]                # one-shot: deploy the schema, then exit
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: pesaroll
      PGUSER: pesaroll
      PGPASSWORD: pesaroll
      PGSSLMODE: disable
    volumes:
      - ./database:/db:ro
    depends_on:
      db: { condition: service_healthy }

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    # Full restart on every change: hot reload can leave the API half old, half new.
    command: dotnet watch run --no-hot-reload --project api/src/Pesaroll.Api --urls http://0.0.0.0:8080
    environment:
      ConnectionStrings__Pesaroll: Host=db;Database=pesaroll;Username=pesaroll;Password=pesaroll
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # Email to Mailpit (http://localhost:8025), SMS to the log: nothing leaves your machine (NTF-01).
      Notifications__Email__Provider: smtp
      Notifications__Email__Smtp__Host: mailpit
      Notifications__Sms__Provider: log
      App__Url: http://localhost:5173    # links in emails and SMS
    ports: ["8080:8080"]
    volumes:
      - .:/src
      - nuget:/root/.nuget/packages
    depends_on:
      db: { condition: service_healthy }
      db-tools: { condition: service_completed_successfully }   # schema in place before the API starts

  worker:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    # Runs queued and recurring jobs (PLAT-04); restarts on every change like the API.
    command: dotnet watch run --no-hot-reload --project api/src/Pesaroll.Worker
    environment:
      ConnectionStrings__Pesaroll: Host=db;Database=pesaroll;Username=pesaroll;Password=pesaroll
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # Email to Mailpit (http://localhost:8025), SMS to the log: nothing leaves your machine (NTF-01).
      Notifications__Email__Provider: smtp
      Notifications__Email__Smtp__Host: mailpit
      Notifications__Sms__Provider: log
      App__Url: http://localhost:5173    # links in emails and SMS
    volumes:
      - .:/src
      - nuget:/root/.nuget/packages
    depends_on:
      db: { condition: service_healthy }
      db-tools: { condition: service_completed_successfully }

  mailpit:
    image: axllent/mailpit:v1.31.2      # a local inbox: every email the app sends lands here
    ports: ["8025:8025"]                # http://localhost:8025

  web:
    image: node:22-alpine
    working_dir: /src/web
    command: sh -c "corepack enable && corepack prepare pnpm@8.10.2 --activate && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      API_URL: http://api:8080
      npm_config_store_dir: /pnpm-store
    ports: ["5173:5173"]
    volumes:
      - .:/src
      - web_node_modules:/src/web/node_modules   # Linux packages, kept apart from the host's
      - pnpm_store:/pnpm-store
    depends_on: [api]

volumes:
  pgdata:
  nuget:
  web_node_modules:
  pnpm_store:
